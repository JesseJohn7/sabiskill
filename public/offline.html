<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Sabiskill</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #f1f5f9;
    }
    
    p {
      font-size: 16px;
      margin-bottom: 30px;
      color: #cbd5e1;
      line-height: 1.6;
    }
    
    .actions {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }
    
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    
    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    
    .btn-secondary {
      background: transparent;
      color: #3b82f6;
      border: 2px solid #3b82f6;
    }
    
    .btn-secondary:hover {
      background: #3b82f6;
      color: white;
    }
    
    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📱</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Some features may not be available, but you can still review your downloaded content.</p>
    <div class="actions">
      <button class="btn-primary" onclick="window.location.href='/'">Back to Home</button>
      <button class="btn-secondary" onclick="window.location.reload()">Try Again</button>
    </div>
  </div>
</body>
</html>
